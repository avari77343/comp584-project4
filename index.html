<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project 4 - Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="wrapper">
    <section class="calculator-screen" aria-label="Calculator display">
      <output id="display" aria-live="polite" aria-atomic="true">0</output>
    </section>
    <section class="calculator-buttons" aria-label="Calculator buttons">
      <button class="clear" data-action="clear" type="button">C</button>
      <button class="backspace" data-action="backspace" type="button" aria-label="Backspace">←</button>
      <button class="operator" data-operator="/" type="button" aria-label="Divide">÷</button>

      <button data-number="7" type="button">7</button>
      <button data-number="8" type="button">8</button>
      <button data-number="9" type="button">9</button>
      <button class="operator" data-operator="*" type="button" aria-label="Multiply">×</button>

      <button data-number="4" type="button">4</button>
      <button data-number="5" type="button">5</button>
      <button data-number="6" type="button">6</button>
      <button class="operator" data-operator="-" type="button">-</button>

      <button data-number="1" type="button">1</button>
      <button data-number="2" type="button">2</button>
      <button data-number="3" type="button">3</button>
      <button class="operator" data-operator="+" type="button">+</button>

      <button class="zero" data-number="0" type="button">0</button>
      <button class="equals" data-action="equals" type="button">=</button>
    </section>
  </main>
</body>
</html>
